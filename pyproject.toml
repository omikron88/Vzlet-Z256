[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mc6809"
version = "0.1.0"
description = "Callback-driven Motorola 6809 / Hitachi 6309 CPU emulation core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vzlet-Z256 contributors"}]
classifiers = ["Programming Language :: Python :: 3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
