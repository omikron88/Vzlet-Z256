name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-executable:
    name: Self-contained Windows x64 executable
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure static bundle
        run: cmake --preset windows-static
      - name: Build
        run: cmake --build --preset windows-static
      - name: Test
        run: ctest --preset windows-static
      - name: Verify startup without repository files
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $exe = "$env:GITHUB_WORKSPACE\build\windows-static\Release\vz256.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory $env:TEMP -PassThru
          Start-Sleep -Seconds 2
          if ($process.HasExited) { throw "vz256.exe exited unexpectedly with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: vz256-windows-x64-static
          path: build/windows-static/Release/vz256.exe
          if-no-files-found: error
